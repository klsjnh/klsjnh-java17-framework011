# ============================================================
# docs/deploy/docker-compose.bake.yml — 项目内编排（方案一：依赖拷贝进镜像 bake）
# 约定对齐 /klsjnh/docker/compose.yaml（networks service011 + ports + logging/healthcheck）
# 用法: bash docs/deploy/deploy.sh bake   （脚本构建镜像并 export APP_IMAGE）
# ============================================================
services:
  klsjnh-java17-framework011:
    image: "${APP_IMAGE:?set APP_IMAGE first}"
    container_name: klsjnh-java17-framework011
    ports:
      - "23333:11160"
    environment:
      - JAVA_OPTS=-Xmx512m -Xms256m -Dfile.encoding=UTF-8 -Duser.timezone=Asia/Shanghai
      - LOGGING_FILE_PATH=/klsjnh/volume/logs
    entrypoint: ["sh", "-c", "exec java $$JAVA_OPTS -jar /klsjnh/app/app.jar --spring.config.additional-location=/klsjnh/volume/config/"]
    volumes:
      - ./java011/klsjnh-java17-framework011/config:/klsjnh/volume/config
      - ./java011/klsjnh-java17-framework011/logs:/klsjnh/volume/logs
      - ./java011/klsjnh-java17-framework011/data:/klsjnh/volume/data
      - ./java011/klsjnh-java17-framework011/storage011:/klsjnh/volume/storage011
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/11160"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"
    networks:
      - service011

networks:
  service011:
    external: false
