spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:33306/dev202609120001?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: dev202608011
    password: dev202608011
    druid:
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        login-username: demo011
        login-password: demo011

