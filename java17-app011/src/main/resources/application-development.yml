# 开发共享配置（入库；键说明见 docs/infrastructure011/015.topic-config.md）
# 数据库：docker 容器 klsjnh-framework011-mysql（mysql 5.7.26），宿主机端口 33306 → 容器 3306
# 主库连接池 = Druid（细化参数在 application.yml 公共段）；监控台 /druid 仅开发环境启用
# 凭据优先读环境变量（见 .env.example）；下方 :default 仅保证本地默认可跑，勿用于生产。

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:33306/klsjnh_framework011?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${KLSJNH_DB_USERNAME:dev202608011}
    password: ${KLSJNH_DB_PASSWORD:dev202608011}
    druid:
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        login-username: ${KLSJNH_DRUID_USERNAME:klsjnh}
        login-password: ${KLSJNH_DRUID_PASSWORD:klsjnh}
        # starter 在 allow 未配置时默认只放行 127.0.0.1（LAN 访问必被拦）——显式放行本机 + 局域网段
        allow: 127.0.0.1,192.168.3.0/24

# 开发运行态：debug 不拒绝请求（免密登录可用），并注入 dev 用 JWT secret
# 生产必须改为 production + 真实 secret（见 application-production.yml）
# 启动时会打醒目 WARN：debug 下认证/鉴权均为开发便利，禁止当生产契约。
krt:
  status: ${KRT_STATUS:debug}
  jwt:
    secret: ${KRT_JWT_SECRET:dev-secret-klsjnh-framework011-20260912-change-me-in-production-0123456789}
    expire-minutes: ${KRT_JWT_EXPIRE_MINUTES:480}
  crypto:
    # AES-256-GCM master key (≥32 bytes). Production: inject via env, never commit.
    master-key: ${KRT_CRYPTO_MASTER_KEY:dev-crypto-master-key-klsjnh-framework011-change-me-32b}

  ci011:
    - ds-code: page-demo
      ds-name: 路由分页演示库
      ds-type: mysql
      ds-url: jdbc:mysql://127.0.0.1:33306/ds20260913001?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
      username: ${KLSJNH_DB_USERNAME:dev202608011}
      password: ${KLSJNH_DB_PASSWORD:dev202608011}
  storage-center:
    default-type: local011
    minio011:
      endpoint: ${KLSJNH_MINIO_ENDPOINT:http://192.168.1.88:11230}
      access-key: ${KLSJNH_MINIO_ACCESS_KEY:demo011}
      secret-key: ${KLSJNH_MINIO_SECRET_KEY:123456789}
      default-bucket: ${KLSJNH_MINIO_DEFAULT_BUCKET:demo011}
