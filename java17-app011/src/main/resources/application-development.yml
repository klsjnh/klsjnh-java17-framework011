# 开发共享配置（入库；键说明见 docs/infrastructure011/015.topic-config.md）
# 数据库：docker 容器 klsjnh-framework011-mysql（mysql 5.7.26），宿主机端口 33306 → 容器 3306
# 主库连接池 = Druid（细化参数在 application.yml 公共段）；监控台 /druid 仅开发环境启用

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:33306/klsjnh_framework011?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: dev202608011
    password: dev202608011
    druid:
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        login-username: klsjnh
        login-password: klsjnh
        # starter 在 allow 未配置时默认只放行 127.0.0.1（LAN 访问必被拦）——显式放行本机 + 局域网段
        allow: 127.0.0.1,192.168.3.0/24

# 开发运行态：debug 不拒绝请求（免密登录可用），并注入 dev 用 JWT secret
# 生产必须改为 production + 真实 secret（见 application-production.yml）
krt:
  status: debug
  jwt:
    secret: dev-secret-klsjnh-framework011-20260912-change-me-in-production-0123456789
    expire-minutes: 480

  ci011:
    - ds-code: page-demo
      ds-name: 路由分页演示库
      ds-type: mysql
      ds-url: jdbc:mysql://127.0.0.1:33306/ds20260913001?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
      username: dev202608011
      password: dev202608011
  storage-center:
    default-type: local011
    minio011:
      endpoint: http://192.168.1.88:11230
      access-key: demo011
      secret-key: "123456789"
      default-bucket: demo011
