# ============================================================
# deploy/docker-compose.yml — 项目内编排（方案二：轻量挂载 mount）
# 用法：在项目根执行
#   docker compose -f deploy/docker-compose.yml up -d
#     （或 bash deploy/deploy.sh mount，脚本会备好 jar 与 runtime 目录）
# 底座：klsjnh/java17:v0.0.1（ubuntu 26.04 + JDK17，见 Dockerfile.base）
# 说明：相对路径以本文件所在目录（deploy/）为基准；runtime/ 不入库
# ============================================================
services:
  app:
    image: klsjnh/java17:v0.0.1
    container_name: klsjnh-java17-framework011
    # host 网络：容器内 127.0.0.1 = 宿主，直连宿主 MySQL 33306
    network_mode: host
    environment:
      - JAVA_OPTS=-Xmx512m -Xms256m -Dfile.encoding=UTF-8 -Duser.timezone=Asia/Shanghai
      - SERVER_PORT=23333
      - LOGGING_FILE_PATH=/klsjnh/volume/logs
    entrypoint: ["sh", "-c", "exec java $$JAVA_OPTS -jar /klsjnh/app/app.jar --spring.config.additional-location=/klsjnh/volume/config/"]
    volumes:
      # 轻量挂载：jar 从构建产物挂入，换 jar 只重启容器（不重建镜像）
      - ../java17-app011/target/java17-app011-1.0.0.jar:/klsjnh/app/app.jar:ro
      # 配置：application.yml + application-development.yml（开发共享，dev 凭据）
      - ../java17-app011/src/main/resources:/klsjnh/volume/config:ro
      - ./runtime/logs:/klsjnh/volume/logs
      - ./runtime/data:/klsjnh/volume/data
      - ./runtime/storage011:/klsjnh/app/storage011
    restart: unless-stopped
