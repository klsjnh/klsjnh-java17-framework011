# ============================================================
# deploy/docker-compose.yml — 项目内编排（方案二：轻量挂载 mount）
# 约定对齐 /klsjnh/docker/compose.yaml：networks service011 + ports 映射 + logging/healthcheck
# 用法（项目根）: docker compose -f deploy/docker-compose.yml up -d
# 上服务器: 把下方 services 段（不含 networks 段）追加到 /klsjnh/docker/compose.yaml
#            （该文件已定义 networks.service011）
# 底座: klsjnh/java17:v0.0.1（ubuntu 26.04 + JDK17）
# 注意: bridge 网络下 DB 用服务名（如 mysql013:3306），不能用 127.0.0.1
# ============================================================
services:
  klsjnh-java17-framework011:
    image: klsjnh/java17:v0.0.1
    container_name: klsjnh-java17-framework011
    ports:
      - "23333:11160"                 # 对外 23333 → 容器应用 11160
    environment:
      - JAVA_OPTS=-Xmx512m -Xms256m -Dfile.encoding=UTF-8 -Duser.timezone=Asia/Shanghai
      - LOGGING_FILE_PATH=/klsjnh/volume/logs
    entrypoint: ["sh", "-c", "exec java $$JAVA_OPTS -jar /klsjnh/app/app.jar --spring.config.additional-location=/klsjnh/volume/config/"]
    volumes:
      # 轻量挂载：jar 从宿主挂入，换 jar 只重启容器
      - ./java011/klsjnh-java17-framework011/app.jar:/klsjnh/app/app.jar:ro
      - ./java011/klsjnh-java17-framework011/config:/klsjnh/volume/config
      - ./java011/klsjnh-java17-framework011/logs:/klsjnh/volume/logs
      - ./java011/klsjnh-java17-framework011/data:/klsjnh/volume/data
      - ./java011/klsjnh-java17-framework011/storage011:/klsjnh/volume/storage011
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/11160"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"
    networks:
      - service011

networks:
  service011:
    external: false
